version: '3.8'

services:
  yerima-naira-bot:
    build: .
    container_name: yerima-naira-bot
    restart: always
    ports:
      - "3000:3000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PORT=3000
      - NODE_ENV=production
